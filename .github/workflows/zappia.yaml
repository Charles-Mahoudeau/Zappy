name: Zappia

on:
  push:
    paths:
      - "zappia/**"
      - ".github/workflows/zappia.yaml"
  pull_request:
    paths:
      - "zappia/**"
      - ".github/workflows/zappia.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zappia

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: zappia/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: List installed packages
        run: python -m pip list

      - name: Check ruff
        run: python -m ruff check .

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            python -m pytest tests
          else
            echo "No tests/ directory found; skipping pytest."
          fi

  check-training-files:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - name: Check if training files changed
        id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^zappia/(train\.ipynb|env\.py|launch_training\.sh)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    runs-on: ubuntu-latest
    needs: [ci, check-training-files]
    if: |
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.check-training-files.outputs.changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Prepare remote folder
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.ZAPPIA_SSH_HOST }}
          username: ${{ secrets.ZAPPIA_SSH_USER }}
          key: ${{ secrets.ZAPPIA_SSH_PRIVATE_KEY }}
          script: |
            set -e
            rm -rf /root/Zappy/zappia
            mkdir -p /root/Zappy

      - name: Upload zappia via SCP
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.ZAPPIA_SSH_HOST }}
          username: ${{ secrets.ZAPPIA_SSH_USER }}
          key: ${{ secrets.ZAPPIA_SSH_PRIVATE_KEY }}
          source: "zappia/rl/**"
          target: "/root/Zappy"

      - name: Install and launch training remotely
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.ZAPPIA_SSH_HOST }}
          username: ${{ secrets.ZAPPIA_SSH_USER }}
          key: ${{ secrets.ZAPPIA_SSH_PRIVATE_KEY }}
          envs_format: export
          script: |
            set -e
            cd /root/Zappy/zappia
            bash /root/Zappy/zappia/launch_training.sh
