name: Zappia

on:
  push:
    paths:
      - "zappia/**"
      - ".github/workflows/zappia.yaml"
  pull_request:
    paths:
      - "zappia/**"
      - ".github/workflows/zappia.yaml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      train_notebook_changed: ${{ steps.notebook_changes.outputs.train_notebook }}

    defaults:
      run:
        working-directory: zappia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: zappia/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: List installed packages
        run: python -m pip list

      - name: Check ruff
        run: python -m ruff check .

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            python -m pytest tests
          else
            echo "No tests/ directory found; skipping pytest."
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && needs.ci.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare remote folder
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ZAPPIA_SSH_HOST }}
          username: ${{ secrets.ZAPPIA_SSH_USER }}
          key: ${{ secrets.ZAPPIA_SSH_PRIVATE_KEY }}
          script: |
            set -e
            rm -rf /root/Zappy/zappia
            mkdir -p /root/Zappy

      - name: Upload zappia via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ZAPPIA_SSH_HOST }}
          username: ${{ secrets.ZAPPIA_SSH_USER }}
          key: ${{ secrets.ZAPPIA_SSH_PRIVATE_KEY }}
          source: "zappia/**"
          target: "/root/Zappy"

      - name: Install and launch training remotely
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ZAPPIA_SSH_HOST }}
          username: ${{ secrets.ZAPPIA_SSH_USER }}
          key: ${{ secrets.ZAPPIA_SSH_PRIVATE_KEY }}
          envs_format: export
          script: |
            set -e
            cd /root/Zappy/zappia
            bash /root/Zappy/zappia/launch_training.sh
