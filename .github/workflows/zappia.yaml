name: Zappia

on:
  push:
    paths:
      - "zappia/**"
      - ".github/workflows/python/zappia.yaml"
  pull_request:
    paths:
      - "zappia/**"
      - ".github/workflows/python/zappia.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zappia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: zappia/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Check ruff
        run: python -m ruff check .

      - name: Check linting with flake8
        run: python -m flake8 .

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            python -m pytest tests
          else
            echo "No tests/ directory found; skipping pytest."
          fi

      - name: Smoke test application
        run: |
          if [ -f zappia/app.py ]; then
              python -m zappia.app
          else
              echo "No zappia/app.py found; skipping smoke test."
          fi
