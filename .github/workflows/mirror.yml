name: Mirror

on:
  push:
    branches: [ main ]
  delete:
    branches: [ main ]

env:
  REPOSITORY_URL: git@github.com:EpitechPGE2-2025/G-YEP-400-NAN-4-1-zappy-1.git

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror repository to Epitech GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.REPOSITORY_URL }}
          ssh_private_key: ${{ secrets.REPOSITORY_SSH_PRIVATE_KEY }}
